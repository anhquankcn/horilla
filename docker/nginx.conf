events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream django {
        server web:8000;
    }

    upstream bff {
        server bff:3000;
    }

    upstream pwa {
        server pwa:8080;
    }

    # Main server — Horilla web app (qlns.hnhtravel.work)
    server {
        listen 80;
        client_max_body_size 50M;
        # Redirect tương đối (Location: /pwa/) để giữ scheme https của client,
        # tránh nginx ghép http:// (đứng sau Cloudflare tunnel).
        absolute_redirect off;

        location /static/build/ {
            alias /static/build/;
            expires 1y;
        }

        location /static/ {
            alias /static/;
            expires 1h;
        }

        location = /favicon.ico {
            alias /static/favicons/favicon.ico;
            expires 1y;
        }

        location /media/ {
            alias /media/;
        }

        # BFF — auth + API proxy for PWA
        location /bff/ {
            proxy_pass http://bff;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 120s;
        }

        # Cửa vào mặc định: gốc "/" → PWA (giao diện mặc định cho mọi user).
        # Exact-match nên chỉ bắt đúng "/", các URL desktop khác vẫn vào Django.
        location = / {
            return 302 /pwa/;
        }

        # PWA frontend (SPA)
        location /pwa/ {
            proxy_pass http://pwa/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Django — catch all
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            # IP thật client qua Cloudflare tunnel — cho M2M auth allowlist theo IP
            # công cộng (vd máy chấm công gọi qua public khi Tailscale offline).
            proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
            proxy_read_timeout 120s;
        }
    }
}
