{% load i18n %}
<div class="oh-card oh-card--margin" style="max-width:500px;margin:0 auto;border:1px solid #dee2e6;">
  <div class="oh-card__header">
    <span class="oh-card__title oh-card__title--sm fw-bold">
      Từ chối người phụ thuộc
    </span>
  </div>
  <div class="oh-card__body">
    <p style="font-size:13px;">
      <strong>{{ dep.full_name }}</strong> ({{ dep.get_relationship_display }})
      — {{ dep.employee }}
    </p>
    <form method="post" action="/payroll/dependent-reject/{{ dep.id }}/">
      {% csrf_token %}
      <div class="mb-3">
        <label class="oh-label" for="reject-reason">Lý do từ chối</label>
        <textarea id="reject-reason" name="reason" class="oh-input w-100" rows="3"
                  placeholder="Nhập lý do để thông báo cho nhân viên..."></textarea>
      </div>
      <div class="d-flex gap-2 justify-content-end">
        <a href="/payroll/dependent-hr-panel/" class="oh-btn oh-btn--light">Hủy</a>
        <button type="submit"
                class="oh-btn oh-btn--danger oh-btn--shadow">
          Xác nhận từ chối
        </button>
      </div>
    </form>
  </div>
</div>
