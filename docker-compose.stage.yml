services:
  web:
    build: .
    volumes:
      - staticfiles:/app/staticfiles
      - /data/media:/app/media
    env_file:
      - .env.stage
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  bff:
    build: ./pwa/bff
    environment:
      KC_BASE: https://sso.hnhtravel.work/realms/HNHTravel-SGN
      KC_CLIENT_ID: horilla-hrm-pwa
      HORILLA_API: http://web:8000
      BFF_PORT: "3000"
      BFF_ORIGIN: https://qlns.hnhtravel.work
      PWA_PATH: /pwa/
      COOKIE_SECRET: ${BFF_COOKIE_SECRET}
      ARKON_BFF_URL: ${ARKON_BFF_URL:-https://arkonbff.hnhtravel.work}
      ARKON_SERVICE_TOKEN: ${ARKON_SERVICE_TOKEN}
    restart: always
    depends_on:
      - web

  pwa:
    build: ./pwa/frontend
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_stage
      POSTGRES_USER: horilla
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla -d horilla_stage"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - /data/redis:/data
    restart: always

  nginx:
    image: nginx:alpine
    volumes:
      - staticfiles:/static:ro
      - /data/media:/media:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - bff
      - pwa
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - nginx
    restart: always

volumes:
  staticfiles:
